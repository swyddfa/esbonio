ci:
  autoupdate_schedule: quarterly

repos:

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
  - id: check-yaml
  - id: end-of-file-fixer
  - id: trailing-whitespace

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.13.1
  hooks:
  - id: ruff
    name: ruff (esbonio)
    args: [--fix, --output-format, concise]
    files: 'lib/esbonio/.*\.py'

  - id: ruff
    name: ruff (esbonio-extensions)
    args: [--fix, --output-format, concise]
    files: 'lib/esbonio-extensions/.*\.py'

  - id: ruff-format
    name: ruff-format (esbonio)
    files: 'lib/esbonio/.*\.py'

  - id: ruff-format
    name: ruff-format (esbonio-extensions)
    files: 'lib/esbonio-extensions/.*\.py'

- repo: https://github.com/pre-commit/mirrors-mypy
  rev: 'v1.15.0'
  hooks:
  - id: mypy
    name: mypy (scripts)
    files: 'scripts/.*\.py'
    exclude: 'scripts/.*_documentation\.py'

  - id: mypy
    name: mypy (esbonio)
    args: [--config,lib/esbonio/pyproject.toml]
    additional_dependencies:
    - aiosqlite
    - platformdirs
    - pygls>=2a2
    - pytest_lsp>=1.0b2
    - sphinx
    - tomli
    - types-docutils
    - types-pygments
    - websockets
    files: 'lib/esbonio/esbonio/.*\.py'
