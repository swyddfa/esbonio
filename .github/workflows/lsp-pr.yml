name: 'PR: esbonio'
on:
  pull_request:
    branches:
    - develop
    - release
    paths:
    - 'lib/esbonio/**'
    - '!lib/esbonio/changes/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Setup Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
      with:
        python-version: "3.11"

    - name: pip cache
      uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-lsp-pr-pip-deps-3.11

    - run: |
        python --version
        python -m pip install --upgrade pip
        python -m pip install --upgrade hatch towncrier
      name: Setup Environment

    - run: |
        set -e
        ./scripts/make_release.py lsp
      name: Set Version

    # TODO: https://github.com/hynek/build-and-inspect-python-package/tree/main#define-python-version-matrix-based-on-package-metadata
    - uses: hynek/build-and-inspect-python-package@d44ca7d91762de7a7d5436ddae667c6da6d1c3df # v 2.18.0
      with:
        path: lib/esbonio

  test:
    name: "Python v${{ matrix.python-version }} -- ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, windows-latest]

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: pip cache
      uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-lsp-pr-pip-deps-${{ matrix.python-version }}

    - run: |
        python --version
        python -m pip install --upgrade hatch
      name: Setup Environment

    - run: |
        cd lib/esbonio

        hatch test -c -i py=${{ matrix.python-version }}
      name: Run Tests
